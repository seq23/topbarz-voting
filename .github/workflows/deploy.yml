# Direct Upload of public/ + functions/ to the Cloudflare Pages project `topbarz-voting`.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages + D1 edit) and CLOUDFLARE_ACCOUNT_ID.
#
# Fires when Validate goes green on `main` (never on a PR, never on a red run), and ships that
# exact commit in two steps:
#   1. STAGING  — preview database migrated, `--branch staging` →
#      https://staging.topbarz-voting.pages.dev (its own D1 and R2: test tracks, test votes).
#      Then the live check (scripts/smoke-live.mjs). If it fails, production is not touched.
#   2. PRODUCTION — production database migrated, `--branch main` →
#      https://topbarz-voting.pages.dev and voting.topbarz.xyz. Then the same live check.
# workflow_dispatch re-ships main's head (or a given sha) the same way; it is refused unless that
# sha has a green Validate run. `~/bin/land` waits for this run after a merge; it never races it.
name: Deploy
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to ship (default: main's head). Must have a green Validate run."
        required: false
        default: ""
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Normal: about two minutes. 10 is a fault detector, never a budget.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # reads Validate runs for the dispatch check
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to run without the deploy token (named stop)
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::NAMED STOP: repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing. See RUNBOOK.md, Deploy."
            exit 1
          fi
      - name: Pick the sha (the one Validate proved)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="$RUN_SHA"
          else
            sha="$(git rev-parse "${INPUT_SHA:-origin/main}")"
            green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.workflow_runs | length')"
            if [ "$green" != 1 ]; then
              echo "::error::REFUSED: no green Validate run on $sha. Run it first: gh workflow run validate.yml --ref main"
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exactly that sha
        run: git checkout -q "${{ steps.pick.outputs.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Staging (preview database + staging branch)
        run: npm run deploy:staging
      - name: Staging answers, with voting switched on
        run: npm run smoke:staging
      - name: Production (production database + main branch)
        run: npm run deploy:production
      - name: Production answers, with voting switched on
        run: npm run smoke:production
      - name: Say what shipped
        run: echo "staging and production <- ${{ steps.pick.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
