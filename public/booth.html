<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Booth upload | Top Barz</title>
<meta name="description" content="The engineer's page: upload a finished track and get the code to hand the artist.">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/dela-gothic-one-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/epilogue-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css">
<link rel="modulepreload" href="/js/dom.js">
<link rel="modulepreload" href="/js/booth-rules.js">
<link rel="modulepreload" href="/js/booth-copy.js">
<script type="module" src="/js/booth.js"></script>
</head>
<body>
<a class="skip" href="#tbz-upload">Skip to the upload</a>

<header class="top">
  <a class="logo" href="https://www.topbarz.xyz/"><img src="/img/logo.png" width="212" height="186" alt="Top Barz"></a>
  <h1 class="slogan">JUMP IN THE BOOTH</h1>
</header>

<main>
  <section class="intro">
    <h2 id="tbz-booth-headline" class="page-title"></h2>
    <p id="tbz-booth-intro" class="lede"></p>
  </section>

  <section id="tbz-upload" class="booth" aria-labelledby="tbz-booth-headline">
    <label id="tbz-zone" class="zone" for="tbz-file">
      <span id="tbz-zone-text" class="zone-text"></span>
      <span id="tbz-zone-hint" class="zone-hint"></span>
      <input type="file" id="tbz-file" class="sr-only" accept="audio/*,.wav,.mp3,.m4a,.aif,.aiff,.flac">
    </label>
    <div id="tbz-progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="tbz-progress-text" hidden>
      <div id="tbz-progress-bar" class="progress-bar"></div>
    </div>
    <p id="tbz-progress-text" class="progress-text" role="status"></p>
    <div id="tbz-done" class="done" hidden>
      <p id="tbz-done-title" class="done-title"></p>
      <p id="tbz-code" class="booth-code" tabindex="-1"></p>
      <p id="tbz-done-file" class="done-file"></p>
      <button type="button" id="tbz-next" class="btn"></button>
    </div>
    <div id="tbz-failed" class="failed" role="alert" hidden>
      <p id="tbz-failed-text"></p>
      <button type="button" id="tbz-retry" class="btn btn-small"></button>
    </div>
    <noscript><p class="list-note">This page needs JavaScript to upload a file. Turn it on and reload.</p></noscript>
  </section>

  <section id="tbz-log" class="booth-log" aria-labelledby="tbz-log-title">
    <h2 id="tbz-log-title"></h2>
    <p id="tbz-log-note" class="list-note" role="status" hidden></p>
    <ul id="tbz-log-list" class="log"></ul>
  </section>
</main>

<footer class="foot">
  <div class="foot-inner">
    <p class="foot-mark">Top Barz</p>
  </div>
</footer>
</body>
</html>
