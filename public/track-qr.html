<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Hear your track, the sign | Top Barz</title>
<meta name="description" content="The sign for the Top Barz booth: scan, enter your code, hear and download your track.">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/dela-gothic-one-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/epilogue-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="print-page">
<header class="top">
  <img class="print-logo" src="/img/logo.png" width="212" height="186" alt="Top Barz">
  <h1 class="slogan">JUMP IN THE BOOTH</h1>
</header>
<main id="tbz-qr" class="qr">
  <h2 class="qr-title">Hear your track</h2>
  <img class="qr-code" src="/img/track-qr.svg" width="37" height="37" alt="QR code that opens voting.topbarz.xyz/track">
  <p class="qr-text">Scan. Enter the code your engineer gives you. Hear and download your track.</p>
  <p class="qr-url">https://voting.topbarz.xyz/track</p>
</main>
</body>
</html>
